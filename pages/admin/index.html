<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            max-height: 90vh;
            overflow-y: auto;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
            font-size: 14px;
        }

        label .required {
            color: #e74c3c;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #fafafa;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .message {
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .items-section {
            margin-top: 30px;
            border-top: 2px solid #f0f0f0;
            padding-top: 25px;
        }

        .items-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .items-header h2 {
            font-size: 18px;
            color: #333;
        }

        .items-count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .items-grid {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 10px;
        }

        .item-card {
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            border-right: 4px solid #667eea;
        }

        .item-card:hover {
            background: #f0f0ff;
            transform: translateX(-5px);
        }

        .item-info {
            flex: 1;
        }

        .item-info .title {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .item-info .price {
            color: #667eea;
            font-weight: 600;
            font-size: 13px;
            margin-right: 10px;
        }

        .item-info .desc {
            color: #888;
            font-size: 12px;
            margin-top: 2px;
        }

        .item-id {
            color: #bbb;
            font-size: 11px;
            margin-left: 10px;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 30px 0;
            font-size: 14px;
        }

        .container::-webkit-scrollbar {
            width: 6px;
        }

        .container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 22px;
            }
            .item-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
            .item-id {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📦 پنل مدیریت</h1>
        <p class="subtitle">افزودن آیتم جدید به منو</p>

        <div id="message" class="message"></div>

        <form id="itemForm">
            <div class="form-group">
                <label for="title">عنوان <span class="required">*</span></label>
                <input type="text" id="title" name="title" placeholder="مثال: پیتزا مخصوص" required>
            </div>

            <div class="form-group">
                <label for="description">توضیحات <span class="required">*</span></label>
                <textarea id="description" name="description" placeholder="توضیحات کامل آیتم" required></textarea>
            </div>

            <div class="form-group">
                <label for="price">قیمت (تومان) <span class="required">*</span></label>
                <input type="number" id="price" name="price" placeholder="مثال: 45000" required>
            </div>

            <div class="form-group">
                <label for="image">آدرس تصویر</label>
                <input type="text" id="image" name="image" placeholder="../assets/image/items/pizza.jpeg" value="../../assets/image/items/default.jpg">
            </div>

            <button type="submit" class="btn-submit">➕ افزودن آیتم</button>
        </form>

        <div class="items-section">
            <div class="items-header">
                <h2>📋 لیست آیتم‌ها</h2>
                <span class="items-count" id="itemsCount">0</span>
            </div>
            <div class="items-grid" id="itemsGrid">
                <div class="empty-message">هیچ آیتمی وجود ندارد</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // آدرس فایل JSON (داخل assets/data/)
        // از pages/admin/index.html تا assets/data/data.json
        // ============================================================
        const JSON_FILE_PATH = '../../assets/data/data.json';

        // ============================================================
        // داده اصلی
        // ============================================================
        let data = {
            dataItem: []
        };

        // ============================================================
        // بارگذاری داده از فایل JSON
        // ============================================================
        async function loadData() {
            try {
                const response = await fetch(JSON_FILE_PATH);
                if (!response.ok) {
                    throw new Error('فایل JSON پیدا نشد!');
                }
                data = await response.json();
                renderItems();
                updateCount();
            } catch (error) {
                console.warn('خطا در خواندن فایل:', error.message);
                // داده پیش‌فرض برای تست
                data = {
                    dataItem: [{
                        id: 1,
                        image: "../../assets/image/items/pizza.jpeg",
                        alt: "test",
                        title: "tuna tartare",
                        description: "frad s;fksdf;sdkjfas;fja;",
                        price: "45"
                    }]
                };
                renderItems();
                updateCount();
                showMessage('⚠️ از داده‌های پیش‌فرض استفاده می‌شود (فایل JSON پیدا نشد)', 'error');
            }
        }

        // ============================================================
        // ذخیره داده در فایل JSON (از طریق سرور)
        // ============================================================
        async function saveData() {
            try {
                const response = await fetch(JSON_FILE_PATH, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data, null, 2)
                });

                if (!response.ok) {
                    throw new Error('خطا در ذخیره داده');
                }

                return true;
            } catch (error) {
                // اگر PUT کار نکرد، از localStorage استفاده کن
                console.warn('ذخیره در سرور ناموفق، استفاده از localStorage:', error.message);
                localStorage.setItem('adminData', JSON.stringify(data));
                return true;
            }
        }

        // ============================================================
        // تولید ID خودکار
        // ============================================================
        function generateId() {
            if (!data.dataItem || data.dataItem.length === 0) return 1;
            const maxId = Math.max(...data.dataItem.map(item => item.id));
            return maxId + 1;
        }

        // ============================================================
        // نمایش پیام
        // ============================================================
        function showMessage(text, type = 'success') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            clearTimeout(msg._timeout);
            msg._timeout = setTimeout(() => {
                msg.className = 'message';
            }, 4000);
        }

        // ============================================================
        // نمایش آیتم‌ها
        // ============================================================
        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            const items = data.dataItem || [];

            if (items.length === 0) {
                grid.innerHTML = '<div class="empty-message">📭 هیچ آیتمی وجود ندارد</div>';
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="item-card">
                    <div class="item-info">
                        <span class="title">${escapeHtml(item.title)}</span>
                        <span class="price">💰 ${escapeHtml(item.price)} تومان</span>
                        <div class="desc">${escapeHtml(item.description)}</div>
                    </div>
                    <span class="item-id">#${item.id}</span>
                </div>
            `).join('');
        }

        // ============================================================
        // به‌روزرسانی تعداد
        // ============================================================
        function updateCount() {
            const count = document.getElementById('itemsCount');
            count.textContent = data.dataItem ? data.dataItem.length : 0;
        }

        // ============================================================
        // escape برای امنیت
        // ============================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // رویداد submit فرم
        // ============================================================
        document.getElementById('itemForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const price = document.getElementById('price').value.trim();
            let image = document.getElementById('image').value.trim();

            if (!title || !description || !price) {
                showMessage('❌ لطفاً تمام فیلدهای الزامی را پر کنید!', 'error');
                return;
            }

            if (!image) {
                image = '../../assets/image/items/default.jpg';
            }

            const newItem = {
                id: generateId(),
                image: image,
                alt: title,
                title: title,
                description: description,
                price: price
            };

            data.dataItem.push(newItem);
            await saveData();

            showMessage(`✅ آیتم "${title}" با موفقیت اضافه شد!`, 'success');
            renderItems();
            updateCount();
            this.reset();

            document.querySelector('.items-section').scrollIntoView({ behavior: 'smooth' });
        });

        // ============================================================
        // اجرا در هنگام لود صفحه
        // ============================================================
        // چک کردن localStorage
        const savedData = localStorage.getItem('adminData');
        if (savedData) {
            try {
                data = JSON.parse(savedData);
                renderItems();
                updateCount();
            } catch (e) {
                loadData();
            }
        } else {
            loadData();
        }

        console.log('✅ پنل ادمین با موفقیت اجرا شد!');
        console.log('📁 مسیر فایل JSON:', JSON_FILE_PATH);
    </script>

</body>
</html>
